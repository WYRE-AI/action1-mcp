services:
  # Gateway mode. API key and secret arrive per request on X-Action1-* headers.
  # Do not set ACTION1_API_KEY, ACTION1_SECRET, or env_file here — that would put
  # static vendor credentials in the container. The project .env is used only
  # for Compose interpolation of CONDUIT_S2S_SECRET. For AUTH_MODE=env, pass
  # ACTION1_API_KEY and ACTION1_SECRET on that process instead (see the README).
  action1-mcp:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ghcr.io/wyre-ai/action1-mcp:latest
    container_name: action1-mcp-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - MCP_TRANSPORT=http
      - MCP_HTTP_HOST=0.0.0.0
      - MCP_HTTP_PORT=8080
      - AUTH_MODE=gateway
      - CONDUIT_S2S_SECRET=${CONDUIT_S2S_SECRET:?set CONDUIT_S2S_SECRET}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes: {}
